name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Build and test (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore Movies.slnx

      - run: dotnet build Movies.slnx --configuration Release --no-restore

      # Integration tests start PostgreSQL in Docker (Testcontainers); GitHub's Ubuntu runners have Docker.
      - run: dotnet test Movies.slnx --configuration Release --no-build

  frontend:
    name: Lint, test and build (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/movies-web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/movies-web/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - run: docker compose build
