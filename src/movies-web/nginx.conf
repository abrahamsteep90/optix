server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Docker's DNS. Looking the API up per request (via the variable below) means nginx
    # keeps working if the API container restarts and gets a new address.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8080;

    # The API and its docs live in the api container (see docker-compose.yml).
    location ~ ^/(api|swagger|openapi|health)(/|$) {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files have a content hash in their names, so browsers can keep them for a long time.
    location /assets/ {
        expires 1y;
    }

    # Every other path is a page of the single-page app, e.g. /movies/42.
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
